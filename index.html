<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tejas Yadavalli — Full-Stack Developer & Software Engineer</title>
<meta name="description" content="Portfolio of Tejas Yadavalli — Full-Stack Developer, AI Integrator, Software Engineer based in Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#07070f;--bg2:#0d0d1a;--bg3:#12121f;
--border:rgba(255,255,255,0.07);
--amber:#e88c3a;--amber2:#ffb366;
--cyan:#00e5ff;--cyan2:#80f4ff;
--text:#e8e8f0;--muted:#8888aa;
--card:#0f0f1e;--cb:rgba(232,140,58,0.15);
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden;cursor:none}
::selection{background:rgba(232,140,58,0.3);color:#fff}
a{text-decoration:none;color:inherit}
/* CURSOR */
#cd{position:fixed;width:8px;height:8px;background:var(--amber);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s,background .2s}
#cr{position:fixed;width:36px;height:36px;border:1.5px solid rgba(232,140,58,.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .2s}
body.hov #cd{width:14px;height:14px;background:var(--cyan)}
body.hov #cr{width:52px;height:52px;border-color:rgba(0,229,255,.4)}
/* CANVAS */
#hcanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 40px;background:rgba(7,7,15,.92);border-bottom:1px solid var(--border)}
.ni{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:64px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;margin-right:auto}
.logo span{color:var(--amber)}
.nlinks{display:flex;gap:4px;align-items:center}
.nl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 14px;border-radius:4px;transition:color .2s;position:relative}
.nl::after{content:'';position:absolute;bottom:4px;left:14px;right:14px;height:1px;background:var(--amber);transform:scaleX(0);transition:transform .2s;transform-origin:right}
.nl:hover{color:var(--text)}.nl:hover::after,.nl.act::after{transform:scaleX(1);transform-origin:left}
.nl.act{color:var(--amber)}
.ncta{margin-left:16px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bg);background:var(--amber);padding:10px 20px;border-radius:4px;transition:background .2s,box-shadow .2s}
.ncta:hover{background:var(--amber2);box-shadow:0 0 20px rgba(232,140,58,.4)}
.hbg{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:none;padding:8px}
.hbg span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
/* HERO */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.hov-overlay{position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 70% 50%,rgba(232,140,58,.05) 0%,transparent 70%),radial-gradient(ellipse 40% 55% at 20% 75%,rgba(0,229,255,.04) 0%,transparent 60%);z-index:1;pointer-events:none}
.hcontent{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:120px 40px 80px;width:100%}
.hbadge{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);border:1px solid rgba(232,140,58,.3);background:rgba(232,140,58,.07);padding:6px 16px;border-radius:2px;margin-bottom:32px}
.hbadge::before{content:'';width:6px;height:6px;background:var(--amber);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.htitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,8vw,108px);line-height:.95;letter-spacing:2px;margin-bottom:28px}
.htitle .ln{display:block;overflow:hidden}
.htitle .wd{display:inline-block;transform:translateY(105%);opacity:0;animation:wup .75s cubic-bezier(.23,1,.32,1) forwards}
.htitle .amber{color:var(--amber)}.htitle .cyan{color:var(--cyan)}
.d0{animation-delay:.05s}.d1{animation-delay:.15s}.d2{animation-delay:.28s}.d3{animation-delay:.42s}.d4{animation-delay:.56s}.d5{animation-delay:.7s}
@keyframes wup{to{transform:translateY(0);opacity:1}}
.hsub{max-width:560px;font-size:17px;color:var(--muted);margin-bottom:44px;line-height:1.8;opacity:0;animation:fup .7s .85s cubic-bezier(.23,1,.32,1) forwards}
.hsub strong{color:var(--text);font-weight:600}
.hbtns{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fup .7s 1s forwards}
@keyframes fup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:15px 30px;border-radius:4px;transition:transform .15s,box-shadow .2s}
.btn-p{background:var(--amber);color:var(--bg);font-weight:600}
.btn-p:hover{box-shadow:0 0 28px rgba(232,140,58,.45)}
.btn-s{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.14)}
.btn-s:hover{border-color:rgba(232,140,58,.5);color:var(--amber)}
.shine{position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:skewX(-20deg);transition:left .45s}
.btn:hover .shine{left:150%}
.hstats{display:flex;gap:36px;margin-top:56px;padding-top:36px;border-top:1px solid var(--border);opacity:0;animation:fup .7s 1.1s forwards;flex-wrap:wrap}
.hstat .num{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--amber);line-height:1}
.hstat .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hscroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;animation:fup .7s 1.3s forwards}
.hscroll span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.sline{width:1px;height:36px;background:linear-gradient(to bottom,var(--amber),transparent);animation:sp 2s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.3}}
/* SECTIONS */
.sec{padding:90px 40px}
.con{max-width:1200px;margin:0 auto}
.slbl{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:14px}
.slbl::before{content:'';width:22px;height:1px;background:var(--amber)}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,5vw,62px);letter-spacing:2px;line-height:1;margin-bottom:14px}
.ssub{font-size:15px;color:var(--muted);max-width:480px}
/* REVEAL */
.rv{opacity:0;transform:translateY(36px);transition:opacity .75s cubic-bezier(.23,1,.32,1),transform .75s cubic-bezier(.23,1,.32,1)}
.rv.vis{opacity:1;transform:translateY(0)}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}
.rv.d4{transition-delay:.4s}.rv.d5{transition-delay:.5s}.rv.d6{transition-delay:.6s}
.rv.d7{transition-delay:.7s}
/* ABOUT */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-top:56px}
.atext p{color:rgba(232,232,240,.82);margin-bottom:18px;font-size:15.5px;line-height:1.9}
.atext strong{color:var(--amber)}
.atags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.atag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;padding:6px 13px;border-radius:2px;border:1px solid rgba(232,140,58,.2);color:var(--amber);background:rgba(232,140,58,.05);transition:background .2s,border-color .2s}
.atag:hover{background:rgba(232,140,58,.1);border-color:rgba(232,140,58,.4)}
.acard{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:28px;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .1s}
.acard::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,rgba(232,140,58,.07),transparent 60%);pointer-events:none}
.brow{display:flex;flex-direction:column;gap:18px}
.bitem .bh{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.btrack{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bfill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:2px;width:0;transition:width 1.3s cubic-bezier(.23,1,.32,1)}
.bfill.c{background:linear-gradient(90deg,var(--cyan),var(--cyan2))}
/* SKILLS */
.skbg{background:var(--bg2)}
.skgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:56px}
.skcard{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:26px;position:relative;overflow:hidden;transition:border-color .3s,transform .25s}
.skcard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),transparent);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.skcard:hover{border-color:rgba(232,140,58,.3);transform:translateY(-3px)}.skcard:hover::after{transform:scaleX(1)}
.skttl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.skttl::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px var(--amber)}
.stags{display:flex;flex-wrap:wrap;gap:7px}
.stag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 13px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--text);transition:all .2s}
.stag:hover{background:rgba(232,140,58,.08);border-color:rgba(232,140,58,.3);color:var(--amber)}
/* FILTER TABS */
.ftabs{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.ftab{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 17px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:none;transition:all .2s}
.ftab:hover{border-color:rgba(232,140,58,.4);color:var(--text)}
.ftab.on{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:600}
/* PROJECTS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;margin-top:52px}
.pc{background:var(--card);border:1px solid var(--cb);border-radius:12px;overflow:hidden;transition:border-color .3s;transform-style:preserve-3d;position:relative}
.pc:hover{border-color:rgba(232,140,58,.4)}
.pci{padding:28px;transform-style:preserve-3d;transition:transform .08s}
.pac{height:3px;background:linear-gradient(90deg,var(--amber),var(--cyan))}
.pc.ca .pac{background:linear-gradient(90deg,var(--cyan),var(--amber))}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.pico{width:42px;height:42px;border-radius:8px;background:rgba(232,140,58,.1);border:1px solid rgba(232,140,58,.2);display:flex;align-items:center;justify-content:center;font-size:19px}
.pc.ca .pico{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.2)}
.plr{display:flex;gap:10px}
.pla{width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
.pla:hover{background:rgba(232,140,58,.1);border-color:rgba(232,140,58,.3);color:var(--amber)}
.pname{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:1px;margin-bottom:9px}
.pdesc{font-size:13.5px;color:var(--muted);line-height:1.75;margin-bottom:18px}
.pstack{display:flex;flex-wrap:wrap;gap:6px;list-style:none}
.pstack li{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:2px;background:rgba(232,140,58,.07);border:1px solid rgba(232,140,58,.15);color:var(--amber)}
.pc.ca .pstack li{background:rgba(0,229,255,.05);border-color:rgba(0,229,255,.15);color:var(--cyan)}
.pglow{position:absolute;bottom:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(232,140,58,.06),transparent 70%);pointer-events:none;opacity:0;transition:opacity .3s}
.pc:hover .pglow{opacity:1}
.pc.ca .pglow{background:radial-gradient(circle,rgba(0,229,255,.05),transparent 70%)}
.pc.hidden{display:none}
.pbadge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:9px}
/* FEATURED */
.pc.feat{grid-column:1/-1}
.pc.feat .pci{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.pc.feat .pname{font-size:34px}
/* TIMELINE */
.tlbg{background:var(--bg2)}
.tl{margin-top:52px;position:relative;padding-left:28px}
.tl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--amber),rgba(232,140,58,.1))}
.tli{position:relative;padding:0 0 44px 36px}
.tli::before{content:'';position:absolute;left:-5px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--amber);box-shadow:0 0 10px rgba(232,140,58,.4);transition:box-shadow .3s}
.tli:hover::before{box-shadow:0 0 18px rgba(232,140,58,.8)}
.tldate{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
.tltitle{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:1px;margin-bottom:4px}
.tlco{font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:12px;font-family:'JetBrains Mono',monospace}
.tlbody{font-size:14px;color:rgba(232,232,240,.75);line-height:1.8}
.tlbody p{margin-bottom:7px}
.tltags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tltag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:2px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.15);color:var(--cyan)}
/* EDU */
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:52px}
.ec{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:28px;position:relative;overflow:hidden;transition:border-color .3s,transform .25s}
.ec:hover{border-color:rgba(232,140,58,.4);transform:translateY(-3px)}
.ec::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),var(--cyan))}
.eyr{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.edeg{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:1px;margin-bottom:5px}
.esc{font-size:13.5px;color:var(--muted)}
.edet{font-size:13px;color:rgba(232,232,240,.7);margin-top:10px;line-height:1.7}
.ebdg{display:inline-block;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:2px;background:rgba(232,140,58,.1);border:1px solid rgba(232,140,58,.2);color:var(--amber)}
/* CERTS */
.cbg{background:var(--bg2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:52px}
.cc{background:var(--card);border:1px solid var(--cb);border-radius:8px;padding:18px;display:flex;align-items:flex-start;gap:12px;transition:border-color .3s,transform .2s;text-decoration:none;color:inherit;cursor:none;position:relative;overflow:hidden}
.cc::after{content:'↗';position:absolute;top:10px;right:12px;font-size:12px;color:var(--amber);opacity:0;transition:opacity .2s}
.cc:hover{border-color:rgba(232,140,58,.4);transform:translateY(-3px)}.cc:hover::after{opacity:1}
.cc.nolink{cursor:default}.cc.nolink:hover{transform:none;border-color:var(--cb)}.cc.nolink::after{display:none}
.cico{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:rgba(232,140,58,.1);border:1px solid rgba(232,140,58,.2);display:flex;align-items:center;justify-content:center;font-size:15px}
.cname{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:3px;padding-right:18px}
.ciss{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.cdate{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}
.cc.hidden{display:none}
/* CONTACT */
.ctact{padding:110px 40px;text-align:center;background:var(--bg);position:relative;overflow:hidden}
.ctact::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(232,140,58,.05) 0%,transparent 70%);pointer-events:none}
.cinn{position:relative;z-index:1;max-width:560px;margin:0 auto}
.clbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.clbl::before,.clbl::after{content:'';width:22px;height:1px;background:var(--amber)}
.ctitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,7vw,88px);letter-spacing:2px;line-height:.95;margin-bottom:22px}
.csub{font-size:15.5px;color:var(--muted);margin-bottom:36px;line-height:1.8}
.cbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:52px}
.flinks{display:flex;gap:22px;justify-content:center;margin-bottom:28px;border-top:1px solid var(--border);padding-top:28px}
.fl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);transition:color .2s}
.fl:hover{color:var(--amber)}
.fnote{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(136,136,170,.45)}
/* MOBILE MENU */
.mob{position:fixed;inset:0;z-index:90;background:rgba(7,7,15,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transform:translateX(100%);transition:transform .4s cubic-bezier(.23,1,.32,1)}
.mob.open{transform:translateX(0)}
.mobl{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:var(--text);transition:color .2s}
.mobl:hover{color:var(--amber)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--amber);border-radius:2px}
@media(max-width:900px){
.agrid,.egrid,.pc.feat .pci{grid-template-columns:1fr}
.skgrid{grid-template-columns:1fr}
.pc.feat{grid-column:auto}
.nlinks{display:none}.hbg{display:flex}
}
@media(max-width:600px){
.hcontent,.sec{padding-left:20px;padding-right:20px}
.pgrid{grid-template-columns:1fr}
nav{padding:0 20px}
.hstats{gap:20px}
}
</style>
</head>
<body>
<div id="cd"></div>
<div id="cr"></div>

<!-- NAV -->
<nav id="nb">
<div class="ni">
<a href="#" class="logo">TEJAS<span>.</span></a>
<div class="nlinks">
<a href="#about" class="nl">About</a>
<a href="#skills" class="nl">Skills</a>
<a href="#projects" class="nl">Projects</a>
<a href="#experience" class="nl">Exp
